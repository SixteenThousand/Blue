### PRINT SCREEN/SCREENSHOT
bindsym {
    Print           exec grimshot --notify savecopy area
    Shift+Print     exec grimshot --notify savecopy output
    Ctrl+Print      exec grimshot --notify savecopy active
    Super+s         exec grimshot --notify savecopy area
    Super+Shift+s   exec grimshot --notify savecopy output
    Control+Super+s exec grimshot --notify savecopy active
}

# vim:ft=swayconfig
